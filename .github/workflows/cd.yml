name: CD

on:
  push:
    branches:
      - main
      - "v*"
      - "workflow"
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "skills-lock.json"

  workflow_dispatch:
    inputs:
      publish:
        description: "Publish 🚀"
        required: false
        type: boolean
        default: false
      force-prerelease:
        description: "Force Pre-release"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write # required for OIDC
  contents: write # required for tag push
  packages: write # required for package publish
  pull-requests: write # required for release PR creation

concurrency:
  group: package-release-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: |
      (github.event_name != 'push' || github.event.created == false) &&
      (contains(fromJSON('["main", "workflow"]'), github.ref_name) ||
      startsWith(github.ref_name, 'v') ||
      github.event.inputs.publish == 'true')
    uses: sketch7/.github/.github/workflows/node-publish.yml@feature/promotable-app-release-cycle
    with:
      package-manager: "pnpm"
      force-preid: ${{ github.event.inputs.force-prerelease == 'true' }}
      version-replace-glob: "libs/**/{package.json,version.ts}"

  prepare-release:
    name: Prepare Release
    needs: publish
    # Only on push to main (not workflow branch, not manual dispatch, not stable branches)
    if: |
      needs.publish.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: sketch7/.github/.github/workflows/prepare-release.yml@feature/promotable-app-release-cycle
    with:
      base-version: ${{ needs.publish.outputs.baseVersion }}
    secrets:
      token: ${{ secrets.GH_PAT }}

  release:
    name: Release
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      contents: write
    uses: sketch7/.github/.github/workflows/create-release.yml@feature/promotable-app-release-cycle
    with:
      version: ${{ needs.publish.outputs.version }}

  bump-main:
    name: Bump main
    needs: [publish, release]
    # After a stable release on the latest major — opens a PR bumping main's minor version
    if: |
      needs.release.result == 'success' &&
      needs.release.outputs.is-latest == 'true' &&
      github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: sketch7/.github/.github/workflows/node-bump-main.yml@feature/promotable-app-release-cycle
    with:
      released-version: ${{ needs.publish.outputs.version }}
    secrets:
      token: ${{ secrets.GH_PAT }}
