name: CI

on:
  push:
    branches:
      - "workflow"
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "skills-lock.json"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - "v*"
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - "skills-lock.json"

permissions:
  contents: read

jobs:
  ci:
    name: node CI
    uses: sketch7/.github/.github/workflows/node-ci.yml@feature/promotable-app-release-cycle
    with:
      package-manager: "pnpm"
